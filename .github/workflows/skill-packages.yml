name: standalone-skill-packages
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/package_skills.py'
      - 'scripts/standalone_skill_installer.py'
      - 'scripts/publish_skill_packages.py'
      - 'tests/test_standalone_skill_packages.py'
      - 'docs/releases/skills-2026-11-01/**'
      - '.github/workflows/skill-packages.yml'
  push:
    branches: [main]
    paths:
      - 'docs/releases/skills-2026-11-01/release.json'
permissions:
  contents: read
concurrency:
  group: standalone-skill-packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check installer upgrade protection
        run: python -B -m unittest discover -s tests -p test_standalone_skill_packages.py -v
      - name: Build and verify all three pinned bundles
        run: python -B scripts/package_skills.py --output "${{ runner.temp }}/skill-packages" --verify
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-skill-packages
          path: ${{ runner.temp }}/skill-packages/*
          compression-level: 0
          retention-days: 7
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: standalone-skill-packages
          path: ${{ runner.temp }}/skill-packages
      - name: Require exact main CI and publish verified draft assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -B scripts/publish_skill_packages.py
          --config docs/releases/skills-2026-11-01/release.json
          --directory "${{ runner.temp }}/skill-packages"
          --expected-ci-sha "${{ github.sha }}"
