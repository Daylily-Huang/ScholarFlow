name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  standalone-reader:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run reader regression and self-tests
        run: |
          python -m unittest discover -s tests -p test_paper_reader.py -v
          python -m unittest discover -s tests -p "test_reader_*.py" -v
          python skills/paper-close-read/scripts/selftest.py --work-dir "${{ runner.temp }}/reader-selftest"
      - name: Rebuild the balanced showcase and retained regression examples
        run: |
          python -m pip install latex2mathml==3.77.0
          python scripts/rebuild_readers.py examples/paper-close-read/thomsen examples/paper-close-read/wilcox examples/paper-close-read/mariana examples/paper-close-read/kross examples/paper-close-read/mckenna examples/paper-close-read/tavani examples/paper-close-read/menis examples/paper-close-read/austen examples/paper-close-read/hardy1908 examples/paper-close-read/carroll1895
          git diff --exit-code -- examples/paper-close-read/*/reader.html
      - name: Require source figure completeness for audited examples
        run: |
          python skills/paper-close-read/scripts/validate_content.py examples/paper-close-read/thomsen/reading-data/fulltext.json examples/paper-close-read/thomsen/reading-data/translations.json examples/paper-close-read/thomsen/reading-data/guide.json --asset-root examples/paper-close-read/thomsen/reading-data --source examples/paper-close-read/thomsen/reading-data/source.md --require-figure-audit
          python skills/paper-close-read/scripts/validate_content.py examples/paper-close-read/wilcox/reading-data/fulltext.json examples/paper-close-read/wilcox/reading-data/translations.json examples/paper-close-read/wilcox/reading-data/guide.json --asset-root examples/paper-close-read/wilcox/reading-data --source examples/paper-close-read/wilcox/reading-data/source.md --require-figure-audit
      - name: Exercise PDF and vocabulary in Chrome
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install playwright
          python scripts/check_reader_pdf_browser.py examples/paper-close-read/hardy1908 examples/paper-close-read/carroll1895 examples/paper-close-read/thomsen examples/paper-close-read/wilcox --work-dir "${{ runner.temp }}/reader-browser" --output "${{ runner.temp }}/reader-browser-evidence" --browser-executable "$(command -v google-chrome)"
          python skills/paper-close-read/scripts/export_pdf.py examples/paper-close-read/hardy1908/reader.html "${{ runner.temp }}/Hardy1908.pdf" --work-dir "${{ runner.temp }}/reader-pdf" --browser "$(command -v google-chrome)"
      - name: Verify standalone release packaging and installation
        run: python scripts/package_reader.py --output "${{ runner.temp }}/reader-release" --verify

  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run stdlib unittest suite (zero dependencies)
        run: python -m unittest discover -s tests -v
      - name: Run scientific benchmark suite
        run: python benchmarks/run_benchmarks.py
      - name: Run domain neutrality linter
        run: python scripts/domain_neutrality_linter.py
      - name: Run skill builtin self-tests
        run: |
          python skills/literature-evidence-extraction/scripts/context_expansion.py --test
          python skills/literature-discovery-acquisition/scripts/calculate_screening_agreement.py --test
          python skills/research-idea-debate/scripts/validate_session.py --self-check
          python skills/research-idea-debate/scripts/session_store_cli.py --help >/dev/null

  contract-validation:
    runs-on: ubuntu-latest
    env:
      SCHOLARFLOW_STRICT_CONTRACT_CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract-test dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Enforce JSON Schema availability
        run: |
          python - <<'PY'
          import jsonschema
          import referencing
          print("jsonschema contract validation enabled")
          PY
      - name: Run strict contract tests
        run: python -m unittest discover -s tests -v

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade pip and install build dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          python -m pip install build
      - name: Verify repo package assets
        run: |
          python -c "import shared.version; print('ScholarFlow Version:', shared.version.__version__)"
          python scripts/verify_package_assets.py
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel into isolated venv and verify outside repo
        run: |
          python -m venv /tmp/scholarflow-wheel-test
          /tmp/scholarflow-wheel-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/scholarflow-wheel-test/bin/python - <<'PY'
          import shared
          import shared.version
          import shared.grill_me
          import shared.context_resolution
          from importlib.resources import files

          lens = files("shared").joinpath("domain_lenses/generic.md")
          assert lens.is_file(), "generic.md domain lens must be packaged in wheel"
          print("Installed wheel smoke test passed in isolated venv outside repo!")
          PY
