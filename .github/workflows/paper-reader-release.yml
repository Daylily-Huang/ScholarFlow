name: paper-reader-release
on:
  pull_request:
    paths:
      - 'skills/paper-close-read/**'
      - 'scripts/package_reader.py'
      - 'scripts/publish_reader_release.py'
      - 'tests/test_reader_release_publisher.py'
      - 'docs/releases/paper-close-read-v1.6.0/**'
      - '.github/workflows/paper-reader-release.yml'
  push:
    branches: [main]
    paths:
      - 'docs/releases/paper-close-read-v1.6.0/**'
      - '.github/workflows/paper-reader-release.yml'
permissions:
  contents: read
concurrency:
  group: paper-reader-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install latex2mathml==3.77.0
      - run: python -B -m unittest discover -s tests -p test_reader_release_publisher.py -v
      - run: python -B scripts/package_reader.py --require-committed --verify --output "${{ runner.temp }}/reader-release"
      - uses: actions/upload-artifact@v4
        with:
          name: paper-close-read-v1.6.0
          path: ${{ runner.temp }}/reader-release/*
          compression-level: 0
          retention-days: 7
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: paper-close-read-v1.6.0
          path: ${{ runner.temp }}/reader-release
      - name: Publish only after exact main CI and asset verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -B scripts/publish_reader_release.py
          --directory "${{ runner.temp }}/reader-release"
          --expected-ci-sha "${{ github.sha }}"
