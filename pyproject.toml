[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarflow"
version = "0.4.0"
description = "An evidence-grounded AI research workflow for literature discovery, evidence extraction, and controversy-aware synthesis."
readme = "README.md"
authors = [{ name = "Daylily-Huang" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
pdf = [
    "pypdf>=3.0.0",
]
dev = [
    "pypdf>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/Daylily-Huang/ScholarFlow"
Repository = "https://github.com/Daylily-Huang/ScholarFlow"
