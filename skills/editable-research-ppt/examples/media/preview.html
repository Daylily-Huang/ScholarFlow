</svg><button id="toggle">暂停</button><button id="restart">重播</button><a href="demo.pptx">打开可编辑PPT</a><h2>同源视频</h2><video controls preload="metadata" poster="static.png" src="concept.mp4"></video><p>SVG动画在浏览器运行；PPT中的视频不能逐项修改内部图形。无网络依赖。</p><script>const svg=document.querySelector('svg');document.querySelector('#toggle').onclick=function(){if(svg.animationsPaused()){svg.unpauseAnimations();this.textContent='暂停'}else{svg.pauseAnimations();this.textContent='继续'}};document.querySelector('#restart').onclick=()=>{svg.setCurrentTime(0);svg.unpauseAnimations();document.querySelector('#toggle').textContent='暂停'};</script></html>
